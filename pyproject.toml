[project]
name = "wmt-pdf"
version = "0.1.0b2"
description = "Lettura, estrazione, OCR e verifica firme di PDF e p7m, con una CLI pensata per gli agenti (pochi token)."
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    { name = "WebMarkeThink", email = "info@webmarkethink.it" }
]
requires-python = ">=3.12"
dependencies = [
    "pypdfium2>=5.14,<6",
    "pdfplumber>=0.11.10,<0.12",
    "asn1crypto>=1.5.1,<2",
    "cryptography>=44; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "pyhanko>=0.37,<0.38",
    "pikepdf>=10.17,<11; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    # Mac Intel: le versioni recenti di questi pacchetti esistono solo per Apple Silicon; lì le ultime con Intel.
    "cryptography>=44,<49; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "pikepdf>=10.13,<10.14; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]

[project.optional-dependencies]
ocr = [
    "rapidocr>=3.10,<4",
    "onnxruntime>=1.20; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    # Le versioni recenti non hanno più i pacchetti per i Mac Intel: lì si usa l'ultima che li ha.
    "onnxruntime>=1.20; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]
convert = [
    "mammoth>=1.13,<2",
    "markdown>=3.11,<4",
    "odfpy>=1.4.1,<2",
    "openpyxl>=3.1.5,<4",
    "python-docx>=1.2,<2",
    "python-pptx>=1.0.2,<2",
    "xhtml2pdf>=0.2.26,<0.3",
]
firma = [
    "aiohttp>=3.9",
    "pyhanko[etsi,image-support,pkcs11]>=0.37,<0.38",
]
gui = [
    "pywebview>=6.2,<7",
]

[project.scripts]
wpdf = "wmt_pdf.cli:main"
wmt-pdf = "wmt_pdf.cli:main"

[dependency-groups]
build = [
    "pip-licenses>=5",
    "pyinstaller>=6.10",
]
dev = [
    "pytest>=8",
    "pytest-cov>=6",
    "reportlab>=4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["ocr: richiede l'extra ocr e scarica i modelli al primo uso"]

[build-system]
requires = ["uv_build>=0.11.15,<0.12.0"]
build-backend = "uv_build"

[tool.uv]
# Piattaforme degli installatori: il lock deve avere pacchetti per tutte.
required-environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",
]
