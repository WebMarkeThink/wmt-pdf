[project]
name = "wmt-pdf"
version = "0.1.0"
description = "Lettura, estrazione, OCR e verifica firme di PDF e p7m, con una CLI pensata per gli agenti (pochi token)."
readme = "README.md"
authors = [
    { name = "WebMarkeThink", email = "info@webmarkethink.it" }
]
requires-python = ">=3.12"
dependencies = [
    "pypdfium2>=5.14,<6",
    "pdfplumber>=0.11.10,<0.12",
    "asn1crypto>=1.5.1,<2",
    "cryptography>=44",
    "pyhanko>=0.37,<0.38",
    "pikepdf>=10.17,<11",
]

[project.optional-dependencies]
ocr = [
    "rapidocr>=3.10,<4",
    "onnxruntime>=1.20",
]
convert = [
    "mammoth>=1.13,<2",
    "markdown>=3.11,<4",
    "odfpy>=1.4.1,<2",
    "openpyxl>=3.1.5,<4",
    "python-docx>=1.2,<2",
    "python-pptx>=1.0.2,<2",
    "xhtml2pdf>=0.2.26,<0.3",
]

[project.scripts]
wpdf = "wmt_pdf.cli:main"
wmt-pdf = "wmt_pdf.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=6",
    "reportlab>=4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["ocr: richiede l'extra ocr e scarica i modelli al primo uso"]

[build-system]
requires = ["uv_build>=0.11.15,<0.12.0"]
build-backend = "uv_build"
